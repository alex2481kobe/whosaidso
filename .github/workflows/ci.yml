name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A workflow that never needs to write should never be
# able to. Narrower write scopes belong in specific trusted workflows only.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Do not leave a credential in the checkout for later steps, or for
          # anything a dependency might run.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # Nothing to cache: there are no dependencies, so there is no go.sum
          # to key a module cache on.
          cache: false

      - name: No dependencies
        # WhoSaidSo is standard library only. A go.sum appearing means something
        # pulled a dependency in, which is a decision, not an accident.
        run: |
          test ! -f go.sum || { echo "go.sum exists: a dependency was added"; exit 1; }

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test under the race detector
        # always(), because a step that only runs when everything else passed
        # is not a check, it is a wish: while any test fails, a step without
        # it is skipped, and the race detector would silently never run.
        #
        # Races are a different property from correctness, so this has to be
        # able to fail on its own and to report when the suite is otherwise
        # red. Admission takes a lock and publishes files, and two writers
        # racing on one command id is a case to measure rather than hope about.
        if: always()
        run: go test ./... -race -count=1

      - name: macOS release builds compile
        # Releases ship darwin arm64 and amd64 binaries. Cross-compiling here
        # proves both targets build; nothing is uploaded.
        if: always()
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/whosaidso
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/whosaidso

  windows:
    # The store's Windows code (owner-only access lists, no-replace
    # publication, directory flushes, the lock) runs only here: none of it is
    # compiled into the Linux job.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Checkout has LF line endings
        # .gitattributes pins LF. A CRLF checkout would fail gofmt and the
        # byte-exact fixtures for a reason that has nothing to do with the code.
        run: |
          ! git ls-files --eol | grep -q 'w/crlf' || { git ls-files --eol | grep 'w/crlf'; exit 1; }

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Diagnose the runner account (temporary)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          cat > go.mod <<'EOF'
          module probe
          go 1.22
          EOF
          cat > main.go <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "os/exec"
              "os/user"
              "path/filepath"
              "syscall"
          )

          func main() {
              dir, _ := os.MkdirTemp("", "probe")
              f := filepath.Join(dir, "held")
              os.WriteFile(f, []byte("x"), 0o600)
              p, _ := syscall.UTF16PtrFromString(f)
              h, err := syscall.CreateFile(p, syscall.GENERIC_READ, 0, nil, syscall.OPEN_EXISTING, 0, 0)
              fmt.Println("hold:", err)
              _, err = os.ReadFile(f)
              fmt.Println("os.ReadFile while held:", err)
              for _, fl := range []uint32{0, syscall.FILE_FLAG_BACKUP_SEMANTICS} {
                  h2, err := syscall.CreateFile(p, syscall.GENERIC_READ, syscall.FILE_SHARE_READ|syscall.FILE_SHARE_WRITE, nil, syscall.OPEN_EXISTING, fl, 0)
                  fmt.Printf("CreateFile flags %#x while held: %v
", fl, err)
                  if err == nil {
                      syscall.CloseHandle(h2)
                  }
              }
              syscall.CloseHandle(h)
              u, _ := user.Current()
              d := filepath.Join(dir, "denied")
              os.Mkdir(d, 0o700)
              out, err := exec.Command("icacls", d, "/inheritance:r", "/grant:r", "*"+u.Uid+":(OI)(CI)F").CombinedOutput()
              fmt.Println("private:", err, string(out))
              out, err = exec.Command("icacls", d, "/deny", "*"+u.Uid+":(W)").CombinedOutput()
              fmt.Println("deny:", err, string(out))
              out, _ = exec.Command("icacls", d).CombinedOutput()
              fmt.Println(string(out))
              fmt.Println("os.Mkdir in denied dir:", os.Mkdir(filepath.Join(d, "sub"), 0o700))
              fmt.Println("os.WriteFile in denied dir:", os.WriteFile(filepath.Join(d, "x"), []byte("x"), 0o600))
              q, _ := syscall.UTF16PtrFromString(filepath.Join(d, "y"))
              h3, err := syscall.CreateFile(q, syscall.GENERIC_WRITE, 0, nil, syscall.CREATE_NEW, syscall.FILE_ATTRIBUTE_NORMAL, 0)
              fmt.Println("CreateFile without backup semantics in denied dir:", err)
              if err == nil {
                  syscall.CloseHandle(h3)
              }
              fmt.Println("user:", u.Uid, "temp:", os.TempDir())
          }
          EOF
          go run .
          fsutil fsinfo volumeinfo C: | head -5 || true

      - name: Diagnose the failing tests (temporary)
        continue-on-error: true
        run: go test ./internal/write -run 'TestRunCaptureFailureKeepsStaging' -count=1 -v


      - name: Test
        if: always()
        run: go test ./... -count=1

      - name: Test under the race detector
        if: always()
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race -count=1
