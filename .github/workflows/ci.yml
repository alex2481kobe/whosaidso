name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A workflow that never needs to write should never be
# able to. Narrower write scopes belong in specific trusted workflows only.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Do not leave a credential in the checkout for later steps, or for
          # anything a dependency might run.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # Nothing to cache: there are no dependencies, so there is no go.sum
          # to key a module cache on.
          cache: false

      - name: No dependencies
        # WhoSaidSo is standard library only. A go.sum appearing means something
        # pulled a dependency in, which is a decision, not an accident.
        run: |
          test ! -f go.sum || { echo "go.sum exists: a dependency was added"; exit 1; }

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test under the race detector
        # always(), because a step that only runs when everything else passed
        # is not a check, it is a wish: while any test fails, a step without
        # it is skipped, and the race detector would silently never run.
        #
        # Races are a different property from correctness, so this has to be
        # able to fail on its own and to report when the suite is otherwise
        # red. Admission takes a lock and publishes files, and two writers
        # racing on one command id is a case to measure rather than hope about.
        if: always()
        run: go test ./... -race -count=1

      - name: macOS release builds compile
        # Releases ship darwin arm64 and amd64 binaries. Cross-compiling here
        # proves both targets build; nothing is uploaded.
        if: always()
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/whosaidso
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/whosaidso

  windows:
    # The store's Windows code (owner-only access lists, no-replace
    # publication, directory flushes, the lock) runs only here: none of it is
    # compiled into the Linux job.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Checkout has LF line endings
        # .gitattributes pins LF. A CRLF checkout would fail gofmt and the
        # byte-exact fixtures for a reason that has nothing to do with the code.
        run: |
          ! git ls-files --eol | grep -q 'w/crlf' || { git ls-files --eol | grep 'w/crlf'; exit 1; }

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Diagnose the runner account (temporary)
        continue-on-error: true
        shell: pwsh
        run: |
          whoami /user /priv
          whoami /groups | Select-String 'Mandatory|Administrators'
          "TEMP=$env:TEMP"
          icacls $env:TEMP
          $t = Join-Path $env:TEMP ('diag-' + [guid]::NewGuid()); New-Item -ItemType Directory $t | Out-Null
          icacls $t
          $f = Join-Path $t 'held.txt'; Set-Content $f 'x'
          $h = [IO.File]::Open($f, 'Open', 'Read', 'None')
          try { [IO.File]::ReadAllBytes($f) | Out-Null; 'read while held exclusively: SUCCEEDED' } catch { "read while held exclusively: $($_.Exception.Message)" }
          $h.Close()
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $t /inheritance:r /grant:r "*${me}:(OI)(CI)F"
          New-Item -ItemType Directory (Join-Path $t 'child') | Out-Null
          icacls $t; icacls (Join-Path $t 'child')

      - name: Diagnose the failing tests (temporary)
        continue-on-error: true
        run: go test ./internal/store -run 'TestPrivateDirectoryListIsSetAtCreation|TestBundleRead' -count=1 -v

      - name: Test
        if: always()
        run: go test ./... -count=1

      - name: Test under the race detector
        if: always()
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race -count=1
