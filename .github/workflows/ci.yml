name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Main requires a status named exactly "check", so that job keeps the name and
# runs on Linux; macOS runs the same steps as its own job beside it.
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build without warnings
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked

  macos:
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build without warnings
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
