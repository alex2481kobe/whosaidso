name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A workflow that never needs to write should never be
# able to. Narrower write scopes belong in specific trusted workflows only.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave a credential in the checkout for later steps, or for
          # anything a dependency might run.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: No dependencies
        # Datum is standard library only. A go.sum appearing means something
        # pulled a dependency in, which is a decision, not an accident.
        run: |
          test ! -f go.sum || { echo "go.sum exists: a dependency was added"; exit 1; }

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test under the race detector
        # always(), because a step that only runs when everything else passed
        # is not a check, it is a wish. Without it this step was SKIPPED on
        # every run while main carried known failing tests, so the race
        # detector never executed in CI once. The config said it ran. It did
        # not run. That is this repository's own subject, committed by me.
        #
        # Races are a different property from correctness, so this has to be
        # able to fail on its own and to report when the suite is otherwise
        # red. Admission takes a lock and publishes files, and two writers
        # racing on one command id is a case to measure rather than hope about.
        if: always()
        run: go test ./... -race -count=1

      - name: The architecture tree in the README is current
        # The tree is generated, so it can be wrong in exactly one way: nobody
        # regenerated it. Watched failing on a deliberately stale tree and
        # passing on a current one before being put here, because a check
        # nobody has seen fail is not evidence of anything.
        if: always()
        run: sh tools/readme-tree.sh -check
