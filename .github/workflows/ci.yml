name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Main requires a status named exactly "check", so that job keeps the name and
# runs on Linux; macOS runs the regular suite in its own job beside it.
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: End-to-end test policy
        run: |
          python3 - <<'PY'
          import pathlib, re
          problems = []
          if pathlib.Path("src/lib.rs").exists():
              problems.append("src/lib.rs is forbidden; test the binary end to end")
          for path in pathlib.Path("src").rglob("*.rs"):
              if re.search(r"#\s*\[\s*test\b|\bcfg\s*\(\s*test\b", path.read_text()):
                  problems.append(f"{path}: source unit tests are forbidden")
          if problems:
              raise SystemExit("\n".join(problems))
          PY
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --locked --all-targets
      - name: Build without warnings
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked

  macos:
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build without warnings
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
